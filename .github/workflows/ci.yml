name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - name: vet
        run: go vet ./...
      - name: build
        run: go build -trimpath -o mealapp .
      - name: smoke test
        run: |
          ./mealapp -port 8099 -host 127.0.0.1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8099/api/stats && break || sleep 1
          done
          echo
          curl -sf "http://127.0.0.1:8099/api/products?q=arroz&max=1.5&limit=3"
          echo
          echo "product count:"
          curl -sf http://127.0.0.1:8099/api/stats
